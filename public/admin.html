<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Admin dashboard for the Dhruv Bajaj personal blog.">
    <title>Admin | Dhruv Bajaj</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <a class="admin-brand" href="index.html">Dhruv Bajaj</a>
        <div class="admin-actions">
            <a class="admin-site-link" href="index.html">View site <span aria-hidden="true">↗</span></a>
            <button class="admin-secondary-button" id="logoutButton" type="button" hidden>Sign out</button>
        </div>
    </header>

    <main class="admin-main">
        <h1>Blog dashboard</h1>
        <p class="admin-status" id="logoutStatus" role="alert"></p>

        <section class="admin-login admin-card" id="adminLogin" aria-labelledby="loginTitle">
            <h2 id="loginTitle">Sign in</h2>
            <p>Use your admin account to update the blog.</p>
            <form id="loginForm" class="admin-form">
                <label>
                    Email address
                    <input id="loginEmail" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </label>
                <label>
                    Password
                    <input id="loginPassword" type="password" autocomplete="current-password" required>
                </label>
                <button class="admin-primary-button" type="submit">Sign in</button>
                <p class="admin-status" id="loginStatus" role="alert"></p>
            </form>
        </section>

        <div class="admin-layout" id="adminContent" hidden>
            <section class="admin-card">
                <div class="admin-card-heading">
                    <div>
                        <h2>Site information</h2>
                    </div>
                </div>

                <form id="siteSettingsForm" class="admin-form">
                    <div class="admin-form-grid">
                        <label>
                            Display name
                            <input id="adminName" name="name" type="text" maxlength="60" required>
                        </label>
                        <label>
                            Hero label
                            <input id="adminKicker" name="kicker" type="text" maxlength="60" required>
                        </label>
                    </div>
                    <label>
                        Hero headline
                        <textarea id="adminHeroTitle" name="heroTitle" rows="3" maxlength="180" required></textarea>
                    </label>
                    <label>
                        Hero description
                        <textarea id="adminHeroDescription" name="heroDescription" rows="3" maxlength="240" required></textarea>
                    </label>
                    <label>
                        About headline
                        <textarea id="adminAboutTitle" name="aboutTitle" rows="3" maxlength="180" required></textarea>
                    </label>
                    <label>
                        About description
                        <textarea id="adminAboutDescription" name="aboutDescription" rows="4" maxlength="320" required></textarea>
                    </label>
                    <div class="admin-actions">
                        <button class="admin-primary-button" type="submit">Save site information</button>
                        <button class="admin-secondary-button" id="resetSettings" type="button">Reset defaults</button>
                    </div>
                    <p class="admin-status" id="settingsStatus" role="status"></p>
                </form>
            </section>

            <section class="admin-card">
                <div class="admin-card-heading">
                    <div>
                        <h2>Manage topics</h2>
                    </div>
                    <span class="admin-count" id="topicCount">0 topics</span>
                </div>

                <form id="topicForm" class="admin-form topic-form">
                    <label>
                        New topic name
                        <input id="topicName" name="topicName" type="text" maxlength="30" placeholder="e.g. Design" required>
                    </label>
                    <label>
                        Short description
                        <input id="topicDescription" name="topicDescription" type="text" maxlength="90" placeholder="What belongs here?">
                    </label>
                    <button class="admin-primary-button" type="submit">Add topic</button>
                    <p class="admin-status" id="topicStatus" role="status"></p>
                </form>

                <div class="topic-manager" id="topicManager"></div>
            </section>

        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
